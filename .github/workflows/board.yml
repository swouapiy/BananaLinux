name: Board
# One handheld's SD card image, then its boot test in QEMU: called by ci.yml once per handheld, so each boot test
# waits only for its own image (with both in one matrix, the RG DS Plus's boot test waited for the RG DS's image too).
# A failed boot test can be run again on its own (Re-run failed jobs) without building the image again.
on:
  workflow_call:
    inputs:
      board:
        description: "rgds or rgds-plus"
        type: string
        required: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the toolchain, the kernel, Mesa and RetroArch)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev unzip rsync cpio file wget python3-dev swig libgnutls28-dev
      # downloads and the compiler cache, kept even when the build fails (the next attempt starts from them)
      - name: Restore downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('buildroot/configs/*', 'buildroot/package/**') }}
          restore-keys: dl-
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ inputs.board }}-${{ github.run_id }}
          restore-keys: ccache-${{ inputs.board }}-
      - name: Build
        run: make ${{ inputs.board }}
      - name: Save downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ hashFiles('buildroot/configs/*', 'buildroot/package/**') }}-${{ inputs.board }}-${{ github.run_id }}
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ inputs.board }}-${{ github.run_id }}
      - name: Build log on failure
        if: failure()
        run: tail -n 200 output/${{ inputs.board }}/build/*/.stamp_* 2>/dev/null | tail -n 50; ls -t output/${{ inputs.board }}/build | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: banana-${{ inputs.board }}
          path: |
            output/${{ inputs.board }}/images/banana-${{ inputs.board }}.img.gz
            output/${{ inputs.board }}/images/banana-${{ inputs.board }}-*.update.tar

  # the whole image booted in QEMU: the first boot makes the data partition, the menu comes up on both panels, a
  # game is started from the library and the menu comes back, a shutdown from the settings powers the VM off; the
  # screenshots and the card's logs are kept as an artifact
  boot:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: banana-${{ inputs.board }}
          path: image
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-utils mtools exfatprogs exfat-fuse
      - name: Boot the image in QEMU
        run: sh tools/qemu-boot.sh image/banana-${{ inputs.board }}.img.gz qemu-out
      - name: Serial log on failure
        if: failure()
        run: tail -n 80 qemu-out/serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-${{ inputs.board }}
          path: |
            qemu-out/*.png
            qemu-out/*.log
