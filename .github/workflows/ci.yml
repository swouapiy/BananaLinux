name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "Also build the SD card images (an hour or more)"
        type: boolean
        default: false
      boards:
        description: "Which handhelds' images (each built and boot-tested on its own)"
        type: choice
        options: [both, rgds-plus, rgds]
        default: both

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30     # (about 10 normally; a test that hangs fails here, not after GitHub's six hours)
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libfreetype-dev libdrm-dev libasound2-dev zlib1g-dev imagemagick g++-aarch64-linux-gnu clang
      - name: banana-ui (headless test, both panel sizes)
        run: make test
      - name: Fuzz the readers of the card's files (themes, expressions, zips, ROM banners, Banana's own files)
        run: FUZZ_SECONDS=20 make fuzz
      - name: The fuzzers' failing inputs (replay one with ui/fuzz/run.sh <target> <input>)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: ui/fuzz/out/crash-*
          if-no-files-found: ignore
      - name: banana-ui with ALSA
        run: make -C ui clean && make -C ui
      - name: bananad (native and aarch64)
        run: |
          make -C system/bananad CFLAGS="-O2 -Werror"
          make -C system/bananad clean
          make -C system/bananad CC=aarch64-linux-gnu-gcc CFLAGS="-O2 -Werror"
      - name: The boot's hardware check (against a made-up handheld's /proc and /sys; dash, then BusyBox as on the handheld)
        run: |
          sh system/tests/health-test.sh
          sudo apt-get install -y busybox-static
          mkdir -p /tmp/bb; for a in sh awk sed grep cat ls mkdir rm touch mv sleep printf date cut tr head tail env timeout; do ln -sf /bin/busybox /tmp/bb/$a; done
          PATH=/tmp/bb:$PATH busybox sh system/tests/health-test.sh
      - name: Sleep (bananad against a made-up /sys in its own namespaces)
        run: sudo system/bananad/tests/sleep-test.sh
      - name: Shell scripts parse
        run: for f in system/rootfs/etc/init.d/* system/rootfs/usr/bin/* system/rootfs/usr/libexec/banana/* system/rootfs/etc/banana/sleep.d/* buildroot/board/rgds/*.sh tools/*.sh; do sh -n "$f" || exit 1; done
      - name: Buildroot defconfigs keep every option
        run: |
          git clone --depth 1 --branch 2026.02.3 https://github.com/buildroot/buildroot /tmp/br
          for d in banana_rgds_defconfig banana_rgds_plus_defconfig banana_universal_defconfig; do
            make -s -C /tmp/br BR2_EXTERNAL=$PWD/buildroot O=/tmp/out-$d $d
            grep -E '^BR2_|^# BR2_.* is not set' buildroot/configs/$d | while IFS= read -r l; do
              grep -qxF "$l" /tmp/out-$d/.config || { echo "$d drops: $l"; exit 1; }
            done
          done

  # each handheld's image and boot test (.github/workflows/board.yml), side by side and independent: the RG DS Plus's
  # boot test starts as soon as its own image is done. "boards" builds one of them only (a quick test of one handheld)
  rgds-plus:
    if: github.event_name == 'workflow_dispatch' && inputs.image && inputs.boards != 'rgds'
    needs: checks
    uses: ./.github/workflows/board.yml
    with:
      board: rgds-plus

  rgds:
    if: github.event_name == 'workflow_dispatch' && inputs.image && inputs.boards != 'rgds-plus'
    needs: checks
    uses: ./.github/workflows/board.yml
    with:
      board: rgds
