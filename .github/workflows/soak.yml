name: Soak
# The long tests, by hand after an image build (fork only, never in a PR branch): the menu driven for hundreds of
# hours of use watching its memory, the sleep test over and over for races, the fuzzers for hours instead of seconds.
# One job after another, each run whatever the one before did.
on:
  workflow_dispatch:
    inputs:
      menu_rounds:
        description: "Menu soak rounds (a million: about 15 min, hundreds of hours of use)"
        default: "1000000"
      sleep_runs:
        description: "Sleep test runs in a row"
        default: "25"
      fuzz_seconds:
        description: "Seconds of fuzzing per reader"
        default: "1500"

jobs:
  menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 libfreetype-dev libdrm-dev zlib1g-dev imagemagick
      - name: The menu, ${{ inputs.menu_rounds }} rounds, its memory read throughout
        run: OUT=$PWD/soak-out ui/tests/soak.sh ${{ inputs.menu_rounds }}
      - name: The menu with AddressSanitizer and UBSan (leaks, misuse), 20000 rounds
        run: SANITIZE=1 OUT=$PWD/soak-asan ui/tests/soak.sh 20000
      - name: The logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-menu
          path: |
            soak-out/soak.log
            soak-out/rss
            soak-asan/soak.log
          if-no-files-found: ignore

  sleep:
    needs: menu
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: The sleep test, ${{ inputs.sleep_runs }} times in a row (a race shows as one failing run)
        run: |
          fails=0
          for i in $(seq ${{ inputs.sleep_runs }}); do
            if timeout 900 sudo system/bananad/tests/sleep-test.sh > run-$i.log 2>&1; then
              echo "run $i: $(tail -n 1 run-$i.log)"; rm run-$i.log
            else
              fails=$((fails + 1)); echo "run $i FAILED:"; grep -E 'FAIL|^[a-z-]* *[0-9]+b?\. ' run-$i.log | grep -B1 FAIL | head -20
            fi
          done
          echo "sleep test: $fails of ${{ inputs.sleep_runs }} runs failed"
          [ $fails = 0 ]
      - name: The failing runs' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-sleep-failures
          path: run-*.log
          if-no-files-found: ignore

  fuzz:
    needs: sleep
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 libfreetype-dev libdrm-dev zlib1g-dev clang
      - name: Every reader of the card's files fuzzed for ${{ inputs.fuzz_seconds }} s
        run: FUZZ_SECONDS=${{ inputs.fuzz_seconds }} ui/fuzz/run.sh
      - name: The failing inputs (replay one with ui/fuzz/run.sh <target> <input>)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-fuzz-failures
          path: ui/fuzz/out/crash-*
          if-no-files-found: ignore
